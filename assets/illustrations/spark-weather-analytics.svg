<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720"><style>
svg > g, svg > path, svg > text {
  opacity: 0;
  animation: archiveAppear .75s cubic-bezier(.22,1,.36,1) forwards;
}
svg > g:nth-of-type(1), svg > path:nth-of-type(1) { animation-delay: .12s; }
svg > g:nth-of-type(2), svg > path:nth-of-type(2) { animation-delay: .28s; }
svg > g:nth-of-type(3), svg > path:nth-of-type(3) { animation-delay: .44s; }
svg > g:nth-of-type(n+4), svg > path:nth-of-type(n+4), svg > text { animation-delay: .62s; }
g path, g line, g ellipse, g polyline, g polygon {
  stroke-dasharray: 1800;
  stroke-dashoffset: 1800;
  animation: archiveDraw 2s cubic-bezier(.22,1,.36,1) .14s forwards;
}
@keyframes archiveDraw { to { stroke-dashoffset: 0; } }
@keyframes archiveAppear { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  svg > g, svg > path, svg > text { opacity: 1; animation: none; }
  g path, g line, g ellipse, g polyline, g polygon {
    stroke-dashoffset: 0;
    animation: none;
  }
}
</style><rect width="1100" height="720" fill="#f4f2ed"/>
<g fill="none" stroke="#9d9990" stroke-width="1.1" stroke-linecap="round">
  <path d="M80 255 C205 172 320 205 430 270 S640 360 755 275"/>
  <path d="M80 365 C210 315 318 350 450 405 S655 470 755 390"/>
  <path d="M80 485 C195 445 330 470 450 525 S635 565 755 505"/>
</g>
<g fill="#171717"><circle cx="205" cy="205" r="6"/><circle cx="430" cy="270" r="7"/><circle cx="318" cy="350" r="6"/><circle cx="655" cy="470" r="7"/></g>
<g fill="#77726a" font-family="DM Sans,Arial" font-size="13" letter-spacing="1.2">
  <text x="80" y="205">TEMPERATURE</text><text x="80" y="330">HUMIDITY</text><text x="80" y="450">WIND</text>
</g>
<g fill="#252420" font-family="Instrument Serif,Georgia" font-size="35">
  <text x="820" y="280">Patterns emerge</text><text x="820" y="324">over time.</text>
</g>
<path d="M820 362 H1010" stroke="#6c7b72" stroke-width="1"/>
<text x="820" y="410" fill="#77726a" font-family="DM Sans,Arial" font-size="15">Scale makes the relationship</text>
<text x="820" y="434" fill="#77726a" font-family="DM Sans,Arial" font-size="15">between signals easier to see.</text>
</svg>