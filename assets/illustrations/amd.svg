<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img"><style>
.draw{stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 2.15s cubic-bezier(.22,1,.36,1) .18s forwards}.draw-slow{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.8s cubic-bezier(.22,1,.36,1) .35s forwards}.mark{opacity:0;animation:appear .65s ease forwards}.d1{animation-delay:.45s}.d2{animation-delay:.75s}.d3{animation-delay:1.05s}.note{opacity:0;animation:appear .9s ease 1.15s forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes appear{to{opacity:1}}@media(prefers-reduced-motion:reduce){.draw,.draw-slow{stroke-dashoffset:0;animation:none}.mark,.note{opacity:1;animation:none}}</style><rect width="1100" height="720" fill="#ece9e1"/>
